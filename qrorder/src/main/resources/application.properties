spring.application.name=qrorder

# 로컬 환경별 민감 설정은 application-local.properties 에서 관리 (gitignore됨)
spring.config.import=optional:classpath:application-local.properties

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=htms.QROrder.**.domain

# Session Configuration (URL에 세션ID 노출 방지)
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=1h

# Static Resource Cache (개발 환경)
spring.web.resources.cache.period=0

# MyBatis Query Log
logging.level.htms.QROrder.auth.repository=DEBUG
logging.level.htms.QROrder.system.repository=DEBUG
logging.level.htms.QROrder.common.repository=DEBUG
logging.level.htms.QROrder.popup.repository=DEBUG
logging.level.htms.QROrder.log.repository=DEBUG
logging.level.htms.QROrder.client.repository=DEBUG

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-part-count=50

# FileIO 저장경로
file.upload.path=${user.dir}/uploads

# JodConverter (LibreOffice PDF 변환) - office-home은 application-local.properties에서 지정
jodconverter.local.enabled=true
jodconverter.local.office-home=