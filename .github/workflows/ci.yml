name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  codex-harness:
    name: Codex Harness Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root tooling
        run: npm ci

      - name: Validate shared agent context
        run: npm run harness:check

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    name: Frontend Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

  frontend-quality:
    name: Frontend Lint and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Run all frontend tests
        run: npm test -- --maxWorkers=2
        working-directory: frontend

  frontend-browser:
    name: Frontend Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Typecheck browser tests
        run: npm run test:e2e:typecheck
        working-directory: frontend

      - name: Run browser regression
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  frontend-codegen-drift:
    name: Frontend Codegen Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate frontend API code
        run: npm run generate
        working-directory: frontend

      - name: Verify generated files are committed
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== Changed files ==="
          git diff --name-status -- frontend/src/generated
          echo "=== Sample diff (auth-api-controller.ts first 50 lines) ==="
          git diff -- frontend/src/generated/auth-api-controller/auth-api-controller.ts | head -50
          echo "=== CRLF check on committed file ==="
          git show HEAD:frontend/src/generated/auth-api-controller/auth-api-controller.ts | cat -A | head -5
          echo "=== CRLF check on generated file ==="
          cat -A frontend/src/generated/auth-api-controller/auth-api-controller.ts | head -5
          git diff --exit-code -- frontend/src/generated || (echo "::error::Codegen 결과가 최신이 아닙니다. frontend에서 'npm run generate'를 실행한 뒤 frontend/src/generated 변경사항을 커밋하세요." && exit 1)

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run backend tests
        run: ./gradlew test
        working-directory: qrorder
